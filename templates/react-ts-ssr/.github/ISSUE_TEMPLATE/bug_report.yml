name: Bug report
description: Report a bug.
title: 'bug: <short description>'
labels: ['bug', 'triage']
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 'e.g. v1.2.0 or commit abc123'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, package manager + version, browser.
      placeholder: 'macOS 14 / Node 22 / pnpm 9 / Chrome 130'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps to reproduce, or a link to a minimal repro.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
