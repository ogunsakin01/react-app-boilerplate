[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22.13"

# No SPA fallback needed. Vike prerenders every route to its own .html file,
# so /docs, /example, /watch, and /404 are all real files on disk.

# Hashed assets are immutable - cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prerendered HTML must revalidate on every request.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Serve the prerendered 404.html on unknown paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Baseline security headers for every path. There's no Content-Security-Policy
# by default: a useful one must list your API, Sentry and embed origins (the
# demo embeds youtube-nocookie.com) and allow the inline theme boot script -
# add one per deployment and test it with Content-Security-Policy-Report-Only.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
