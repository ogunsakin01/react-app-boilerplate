name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - '@react-app-boilerplate/template-react-ts'
          - '@react-app-boilerplate/template-react-ts-ssr'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers + system deps
        run: pnpm --filter ${{ matrix.template }} exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter ${{ matrix.template }} e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.template == '@react-app-boilerplate/template-react-ts' && 'spa' || 'ssr' }}
          path: templates/*/playwright-report/
          retention-days: 14
