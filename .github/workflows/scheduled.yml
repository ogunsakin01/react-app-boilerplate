name: Scheduled CI

on:
  schedule:
    # Every Monday 06:00 UTC - catches ecosystem breakage between commits.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scheduled:
    name: lint / typecheck / test / build (weekly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
