name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload SPA coverage to Codecov
        if: ${{ !cancelled() && hashFiles('templates/react-ts/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: templates/react-ts/coverage/lcov.info
          slug: ogunsakin01/react-app-boilerplate
          flags: template-react-ts
          fail_ci_if_error: false
          verbose: true

      - name: Upload SSR coverage to Codecov
        if: ${{ !cancelled() && hashFiles('templates/react-ts-ssr/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: templates/react-ts-ssr/coverage/lcov.info
          slug: ogunsakin01/react-app-boilerplate
          flags: template-react-ts-ssr
          fail_ci_if_error: false
          verbose: true
